apiVersion: apps/v1
kind: Deployment
metadata:
  name: mistral-7b-deployment
  namespace: ia-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-server  # Mesmo label
      model: mistral-7b
  template:
    metadata:
      labels:
        app: llm-server  # Mesmo label
        model: mistral-7b
    spec:
      containers:
      - name: mistral-7b
        image: ghcr.io/ggml-org/llama.cpp:server-cuda
        args:
        - --model
        - /models/mistral-7b.Q4_K_M.gguf
        - --port
        - "8000"  # SEMPRE porta 8000
        - --host
        - "0.0.0.0"
        - --n-gpu-layers
        - "22"
        - --n-predict
        - "2048"
        - --ctx-size
        - "8192"
        ports:
        - containerPort: 8000  # SEMPRE porta 8000
          name: http
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "10Gi"
          requests:
            nvidia.com/gpu: 1
            memory: "8Gi"
        volumeMounts:
        - name: models-volume
          mountPath: /models
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: llm-models-pvc