apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui-deployment
  namespace: ia-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: OLLAMA_API_BASE_URL
              value: "http://ollama-service:11434"
            - name: OLLAMA_BASE_URL
              value: "http://ollama-service:11434"
            - name: DATABASE_URL
              value: "postgresql://ollamawebui:ollamawebuipass123@postgres-service:5432/ollamawebui"
            - name: DEFAULT_LOCALE
              value: "pt-BR"
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
