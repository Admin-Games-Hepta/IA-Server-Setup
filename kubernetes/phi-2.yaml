apiVersion: apps/v1
kind: Deployment
metadata:
  name: phi-2-deployment
  namespace: ia-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-server
      model: phi-2
  template:
    metadata:
      labels:
        app: llm-server
        model: phi-2
    spec:
      containers:
      - name: phi-2
        image: ghcr.io/ggml-org/llama.cpp:server
        args:
        - --model
        - /models/phi-2.Q4_K_M.gguf
        - --port
        - "8000"
        - --host
        - "0.0.0.0"
        - --n-gpu-layers
        - "0"
        - --ctx-size
        - "2048"  # Reduzido drasticamente
        - --threads
        - "4"    # Apenas 1 thread inicialmente
        - --batch-size
        - "512"  # Batch menor
        - --n-predict
        - "256"   # Apenas 32 tokens para teste
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            memory: "4Gi"
            cpu: "2"
          requests:
            memory: "2Gi"
            cpu: "1"
        volumeMounts:
        - name: models-volume
          mountPath: /models
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: llm-models-pvc