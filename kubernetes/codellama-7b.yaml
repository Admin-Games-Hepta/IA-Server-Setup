apiVersion: apps/v1
kind: Deployment
metadata:
  name: codellama-7b-deployment
  namespace: ia-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-server  # Mesmo label para todos
      model: codellama-7b
  template:
    metadata:
      labels:
        app: llm-server  # Mesmo label
        model: codellama-7b
    spec:
      containers:
      - name: codellama-7b
        image: ghcr.io/ggml-org/llama.cpp:server-cuda
        args:
        - --model
        - /models/codellama-7b.Q4_K_M.gguf
        - --port
        - "8000"  # SEMPRE porta 8000
        - --host
        - "0.0.0.0"
        - --n-gpu-layers
        - "20"
        - --n-predict
        - "512"
        - --ctx-size
        - "4096"
        ports:
        - containerPort: 8000  # SEMPRE porta 8000
          name: http
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "8Gi"
          requests:
            nvidia.com/gpu: 1
            memory: "6Gi"
        volumeMounts:
        - name: models-volume
          mountPath: /models
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: llm-models-pvc