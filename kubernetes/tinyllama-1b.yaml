apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinyllama-1b-deployment
  namespace: ia-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-server
      model: tinyllama-1b
  template:
    metadata:
      labels:
        app: llm-server
        model: tinyllama-1b
    spec:
      containers:
      - name: tinyllama-1b
        image: ghcr.io/ggml-org/llama.cpp:server
        args:
        - --model
        - /models/tinyllama-1b.Q4_K_M.gguf
        - --port
        - "8000"
        - --host
        - "0.0.0.0"
        - --n-gpu-layers
        - "0"
        - --n-predict
        - "128"
        - --ctx-size
        - "1024"
        - --threads
        - "2"
        - --batch-size
        - "256"
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            memory: "2Gi"
            cpu: "2"
          requests:
            memory: "1Gi"
            cpu: "1"
        volumeMounts:
        - name: models-volume
          mountPath: /models
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: llm-models-pvc